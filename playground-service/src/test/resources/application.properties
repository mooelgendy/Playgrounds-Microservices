server.port=0
spring.application.name=playground-service

# In-memory database so the context and persistence layer can be tested without MySQL.
spring.datasource.url=jdbc:h2:mem:playgrounddb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Disable Redis-backed caching and service discovery during tests.
spring.cache.type=none
spring.redis.host=localhost
spring.redis.port=6379
eureka.client.enabled=false
spring.cloud.discovery.enabled=false
